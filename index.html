<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<!-- ============ SEO ============ -->
<title>Dhruba Majumder — Portfolio | BCA Student, Global Knowledge Campus</title>
<meta name="description" content="Dhruba Majumder — final-year BCA student at Global Knowledge Campus, founder of Hastavya, and builder of CMP, a biosignal-controlled bionic wheelchair. Explore projects, skills, and contact info.">
<meta name="keywords" content="Dhruba Majumder, Global Knowledge Campus, Global College of Science and Technology, BCA, BCA student Kolkata, Hastavya, CMP bionic wheelchair, NIMCET, JECA, D-Majumder GitHub">
<meta name="author" content="Dhruba Majumder">
<link rel="canonical" href="https://dhrubamajumder.pages.dev/">
<meta name="robots" content="index, follow">

<!-- ============ Open Graph / social sharing ============ -->
<meta property="og:type" content="website">
<meta property="og:title" content="Dhruba Majumder — Portfolio">
<meta property="og:description" content="BCA student, founder of Hastavya, and builder of CMP — a biosignal-controlled bionic wheelchair. An interactive desktop-style portfolio.">
<meta property="og:image" content="assets/og-banner.png">
<meta property="og:url" content="https://dhrubamajumder.pages.dev/">
<meta property="og:site_name" content="Dhruba Majumder — Portfolio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dhruba Majumder — Portfolio">
<meta name="twitter:description" content="BCA student, founder of Hastavya, and builder of CMP — a biosignal-controlled bionic wheelchair.">
<meta name="twitter:image" content="assets/og-banner.png">

<!-- ============ Favicon ============ -->
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B1622">

<!-- ============ Structured data ============ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Dhruba Majumder",
  "url": "https://dhrubamajumder.pages.dev/",
  "sameAs": [
    "https://github.com/D-Majumder",
    "https://www.linkedin.com/in/iamdhrubamajumder/"
  ],
  "jobTitle": "BCA Student & Founder",
  "worksFor": { "@type": "Organization", "name": "Hastavya" },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "Global Knowledge Campus" }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ WALLPAPER (reacts to the cursor) ============ -->
<div id="wallpaper" aria-hidden="true">
  <div class="blob-field" id="blob-field">
    <div class="soft-blob blob-1"></div>
    <div class="soft-blob blob-2"></div>
    <div class="soft-blob blob-3"></div>
  </div>
  <div class="cursor-glow" id="cursor-glow"></div>
</div>

<!-- ============ BOOT / WELCOME (typing sequence) ============ -->
<div id="boot-screen">
  <div class="boot-inner">
    <div class="boot-mark" id="boot-mark">D</div>
    <div class="typewriter" id="type-line-1"></div>
    <div class="typewriter typewriter-sub" id="type-line-2"></div>
    <div class="name-entry" id="name-entry">
      <input id="username-input" class="name-input" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Your name">
      <button id="boot-continue" class="boot-continue" aria-label="Continue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ============ SLEEP OVERLAY ============ -->
<div id="sleep-screen" class="hidden">
  <div id="sleep-clock">--:--:--</div>
  <div class="sleep-hint">Click or press any key to wake</div>
</div>

<!-- ============ MOBILE VIEW ============ -->
<div id="mobile-view" class="hidden">
  <div class="m-status-bar">
    <span id="m-clock">--:--</span>
    <div class="m-status-right">
      <span class="theme-place-label" id="m-theme-place-label" data-short="1" title="Local time in Kolkata">Day here</span>
      <button class="m-power-btn theme-toggle-btn" id="m-theme-toggle-btn" title="Switch day/night">
        <span class="theme-toggle-icon">🌙</span>
      </button>
      <button class="m-power-btn" id="m-power-btn" title="Power">⏻</button>
    </div>
  </div>
  <div id="m-power-menu" class="power-menu hidden"></div>

  <div id="m-home" class="m-home">
    <div id="m-widgets" class="m-widgets"></div>
    <div id="m-app-grid" class="m-app-grid"></div>
  </div>
  <div id="m-dock" class="m-dock"></div>

  <div id="m-app-view" class="m-app-view hidden">
    <div class="m-app-header">
      <button id="m-back-btn" class="m-back-btn">‹ Home</button>
      <span id="m-app-title" class="m-app-title"></span>
      <span style="width:56px"></span>
    </div>
    <div id="m-app-body" class="m-app-body"></div>
  </div>
</div>

<!-- ============ DESKTOP ============ -->
<div id="desktop" class="hidden">

  <header id="menu-bar">
    <div class="menu-left">
      <button class="menu-mark" id="menu-mark" title="Menu">◈</button>
      <div id="power-menu" class="power-menu hidden"></div>
      <span id="menu-bar-name" class="menu-title"></span>
    </div>
    <div class="menu-right">
      <button class="menu-pill" id="uptime-pill" title="System Monitor">
        <span class="pulse-dot"></span>
        <span id="uptime-counter">Online 0d</span>
      </button>
      <button class="menu-pill hidden" id="visit-pill" title="Total site visits">
        <span>👀</span><span class="visit-count">0</span>
      </button>
      <span class="theme-place-label" id="theme-place-label" title="Local time in Kolkata">Day here</span>
      <button class="menu-icon-btn theme-toggle-btn" id="theme-toggle-btn" title="Switch day/night">
        <span class="theme-toggle-icon">🌙</span>
      </button>
      <button class="menu-icon-btn" id="music-toggle-btn" title="Music">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm12-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="menu-clock-wrap">
        <button class="menu-icon-btn menu-clock" id="clock-btn">
          <span id="clock">--:--</span>
        </button>
        <div id="calendar-pop" class="calendar-pop hidden"></div>
      </div>
    </div>
  </header>

  <!-- pinned desktop widget (weather + aqi) -->
  <div id="desktop-widget" class="desktop-widget glass"></div>

  <div id="windows-layer"></div>
  <div id="notification-stack"></div>

  <div id="music-player" class="hidden">
    <div class="player-meta">
      <div class="player-track" id="player-track">No track loaded</div>
      <div class="player-progress-track">
        <div class="player-progress-fill" id="player-progress-fill"></div>
      </div>
    </div>
    <div class="player-controls">
      <button id="player-prev" class="player-btn" title="Previous">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
      </button>
      <button id="player-play" class="player-btn player-btn-main" title="Play/Pause">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="player-next" class="player-btn" title="Next">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
      </button>
      <button id="player-loop" class="player-btn player-btn-toggle" title="Loop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <audio id="audio-el" preload="none"></audio>
  </div>

  <nav id="dock"></nav>
</div>

<script src="js/data.js"></script>
<script src="js/github.js"></script>
<script src="js/shared.js"></script>
<script src="js/desktop.js"></script>
<script src="js/mobile.js"></script>
<script src="js/theme.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
